name: 🌐 Multilingual README Sync (i18n)

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-sync
  cancel-in-progress: false

jobs:
  sync-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize Chinese & Russian READMEs
        run: |
          python3 scripts/i18n_sync.py --lang all

      - name: Commit localized READMEs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.zh-CN.md README.ru.md data/i18n_cache.json
          if git diff --staged --quiet; then
            echo "No translation differences detected."
          else
            git commit -m "docs(i18n): sync multilingual Chinese and Russian READMEs [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
