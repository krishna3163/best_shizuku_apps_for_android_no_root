name: 🛡️ Archived & Abandoned Repo Detector

on:
  schedule:
    # Run once every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-detector
  cancel-in-progress: false

jobs:
  check-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Archive Detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/archive_detector.py --output-json site/repo_health.json --output-md site/repo_health.md

      - name: Check in generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/repo_health.json site/repo_health.md || true
          if git diff --staged --quiet; then
            echo "No changes in repository health status."
          else
            git commit -m "chore(health): update upstream repository health report [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
