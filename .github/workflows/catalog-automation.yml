name: Shizuku catalog automation

on:
  push:
    branches: [main]
    paths: [README.md, scripts/**, .github/**]
  pull_request:
    paths: [README.md, scripts/**, .github/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Catalog Check - ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [links, duplicates, toc, tables, licenses, labels, shizuku, security, featured, stats, sort, issue-form, workflow, site, discovery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/catalog.py --task "${{ matrix.task }}"

  test:
    name: Automated Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Test Suite
        run: pytest -v