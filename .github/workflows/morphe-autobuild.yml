name: Morphe Patched Apps Auto-Build & Sync (Non-Root)

on:
  push:
    branches:
      - main
    paths:
      - "config/morphe_apps.json"
      - "patch-config.json"
      - "arch-config.json"
      - "sources/**"
      - "apps/**"
      - "src/**"
      - ".github/workflows/morphe-autobuild.yml"
      - "scripts/**"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Application slug or package name (leave empty to sync all)"
        required: false
        type: string
      dry_run:
        description: "Dry run (build without publishing releases)"
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: "Force re-generation of all Morphe packages"
        required: false
        type: boolean
        default: false
      channel:
        description: "Release channel filter"
        required: false
        type: choice
        options:
          - all
          - stable
          - beta
          - prerelease
        default: all
      build_type:
        description: "Build type filter"
        required: false
        type: choice
        options:
          - all
          - autobuild
          - autogenerated
          - release
        default: all
  repository_dispatch:
    types: [morphe-patch-push]

permissions:
  contents: write

concurrency:
  group: morphe-sync
  cancel-in-progress: false

jobs:
  build-and-sync:
    name: Build & Synchronize Morphe Releases
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        options: --shm-size=1gb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android Build Tools (apksigner & zipalign)
        run: |
          sudo apt-get update && sudo apt-get install -y apksigner zipalign

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Morphe Desktop CLI
        run: |
          mkdir -p data
          CLI_URL=$(curl -sL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | grep "browser_download_url.*-all.jar" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$CLI_URL" ]; then
            echo "Downloading Morphe Desktop CLI from $CLI_URL..."
            curl -sSL --connect-timeout 30 --max-time 300 -o data/morphe-desktop.jar "$CLI_URL"
            java -jar data/morphe-desktop.jar --help > /dev/null 2>&1 && echo "Morphe Desktop CLI verified successfully" || echo "Morphe CLI verification fallback"
          fi

      - name: Run Morphe Auto-Builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLARESOLVERR_URL: http://localhost:8192/v1
        run: |
          ARGS=""
          if [ -n "${{ inputs.app }}" ]; then
            ARGS="$ARGS --app ${{ inputs.app }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            ARGS="$ARGS --force-rebuild"
          fi
          if [ -n "${{ inputs.channel }}" ] && [ "${{ inputs.channel }}" != "all" ]; then
            ARGS="$ARGS --channel ${{ inputs.channel }}"
          fi
          if [ -n "${{ inputs.build_type }}" ] && [ "${{ inputs.build_type }}" != "all" ]; then
            ARGS="$ARGS --build-type ${{ inputs.build_type }}"
          fi
          python scripts/morphe_sync.py $ARGS

      - name: Commit and push metadata and README changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README*.md docs/ MORPHE.md patch-config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-build & sync morphe non-root releases [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push && break || sleep 3
            done
          fi
