name: Morphe Patched Apps Auto-Build & Sync (Non-Root)

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Application slug or package name (leave empty to sync all)"
        required: false
        type: string
      dry_run:
        description: "Dry run (build without publishing releases)"
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: "Force re-generation of all Morphe packages"
        required: false
        type: boolean
        default: false
      channel:
        description: "Release channel filter"
        required: false
        type: choice
        options:
          - all
          - stable
          - beta
          - prerelease
        default: all
      build_type:
        description: "Build type filter"
        required: false
        type: choice
        options:
          - all
          - autobuild
          - autogenerated
          - release
        default: all
  repository_dispatch:
    types: [morphe-patch-push]

permissions:
  contents: write

concurrency:
  group: morphe-sync
  cancel-in-progress: false

jobs:
  build-and-sync:
    name: Build & Synchronize Morphe Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Morphe Auto-Builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.app }}" ]; then
            ARGS="$ARGS --app ${{ inputs.app }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            ARGS="$ARGS --force-rebuild"
          fi
          if [ -n "${{ inputs.channel }}" ] && [ "${{ inputs.channel }}" != "all" ]; then
            ARGS="$ARGS --channel ${{ inputs.channel }}"
          fi
          if [ -n "${{ inputs.build_type }}" ] && [ "${{ inputs.build_type }}" != "all" ]; then
            ARGS="$ARGS --build-type ${{ inputs.build_type }}"
          fi
          python scripts/morphe_sync.py $ARGS

      - name: Commit and push metadata and README changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-build & sync morphe non-root releases [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push && break || sleep 3
            done
          fi
