name: 🧹 Table Formatter & Alphabetizer

on:
  pull_request:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-tables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-tables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Table Formatter
        run: |
          python3 scripts/format_tables.py --write

      - name: Commit formatted tables if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Tables are already properly alphabetized and formatted."
          else
            git commit -m "style: alphabetize and format markdown tables [skip ci]"
            for i in {1..5}; do
              git pull --rebase && git push && break || sleep 3
            done
          fi
