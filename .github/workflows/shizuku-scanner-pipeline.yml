name: 🔍 Shizuku App Scanner & Auto-Release Pipeline

on:
  schedule:
    # Run twice daily (every 12 hours)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shizuku-scanner-pipeline
  cancel-in-progress: false

jobs:
  scan-and-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Source Scanner & APK Release Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/shizuku_scanner.py --sync-releases

      - name: Format Markdown Tables
        run: |
          python scripts/format_tables.py --write || true

      - name: Synchronize Full Multilingual Documentation (ZH / RU)
        run: |
          python scripts/i18n_sync.py --lang all || true

      - name: Commit Discovered Apps, Translations & Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/apps.json README.md README.zh-CN.md README.ru.md data/
          if git diff --staged --quiet; then
            echo "No new Shizuku apps or translation changes detected."
          else
            git commit -m "feat(ecosystem): auto-discover Shizuku apps, mirror APKs & sync i18n [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
