<svg xmlns="http://www.w3.org/2005/svg" width="820" height="180" viewBox="0 0 820 180" fill="none">
  <style>
    .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
    .chip-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1px; rx: 12px; }
    .chip-name { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
    .chip-role { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
    .avatar-text { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f8fafc; }
      .subtitle { fill: #94a3b8; }
      .chip-bg { fill: #1e293b; stroke: #334155; }
      .chip-name { fill: #f8fafc; }
      .chip-role { fill: #94a3b8; }
    }
  </style>
  <defs>
    <linearGradient id="grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="820" height="180" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="38" class="title">👥 Project Contributors &amp; Community Heroes</text>
  <text x="24" y="58" class="subtitle">Thank you to everyone helping curate, build, and support the Android Shizuku ecosystem! (2 contributors)</text>
  <a href="https://github.com/github-actions[bot]" target="_blank">
    <rect x="24" y="80" width="180" height="64" class="chip-bg" />
    <circle cx="50" cy="112" r="18" fill="url(#grad-0)"/>
    <text x="50" y="112" class="avatar-text">GA</text>
    <text x="76" y="106" class="chip-name">github-actions</text>
    <text x="76" y="124" class="chip-role">384 contributions</text>
  </a>
  <a href="https://github.com/krishna3163" target="_blank">
    <rect x="220" y="80" width="180" height="64" class="chip-bg" />
    <circle cx="246" cy="112" r="18" fill="url(#grad-1)"/>
    <text x="246" y="112" class="avatar-text">KR</text>
    <text x="272" y="106" class="chip-name">krishna3163</text>
    <text x="272" y="124" class="chip-role">Maintainer</text>
  </a>
</svg>